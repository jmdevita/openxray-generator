# OpenXray Generator: the stack that MAKES timelines from your own media
# (the Hub, in ../hub, distributes them). Orchestrator/frontend + stateless
# engine services. State lives in the timelines volume: the same store the
# CLI and Plezy use. The hub (hub/) deploys separately (or add it here).
#
#   cd generator && docker compose up -d
#   open http://localhost:8080
#
# Secrets: put keys in generator/.env (gitignored). Compose reads that file
# automatically, so every variable below is picked up by `docker compose` with
# nothing on the command line:
#   PLEX_ORIGIN=https://plex.example.com
#   PLEX_TOKEN=...   TMDB_KEY=...   AUDD_API_TOKEN=...
#   HF_TOKEN=hf_...      # optional: only for the speakers profile. Present, it
#                        # bakes the diarization weights into the image at build
#                        # time; absent, the dashboard fetches them on request
#                        # (Setup → Speakers) and the build still succeeds.
#   XRAY_WEB_TOKEN=...   # optional: pin the dashboard token instead of the
#                        # generated one (env overrides always; rotation = edit + restart)

# Pinned so the project and its state don't depend on this directory's name,
# renaming the folder would otherwise orphan the volume holding your sign-in
# and every timeline you've generated.
name: openxray-generator

services:
  orchestrator:
    # container_name pins what `docker ps` shows; inter-service DNS still uses
    # the service names below (engine-audio, engine-faces), so the URLs hold.
    container_name: openxray-generator
    build: { context: .., dockerfile: generator/orchestrator.Dockerfile }
    # All interfaces on purpose: the dashboard is meant to be opened from
    # another machine on your LAN. Be aware Docker publishes ports by writing
    # NAT rules, so this BYPASSES a host firewall (ufw included) -- firewalling
    # the host does not close it. Narrow to 127.0.0.1:8080:8080 and put a
    # reverse proxy in front if this host can reach anything untrusted.
    ports: ["8080:8080"]
    environment:
      PLEX_ORIGIN: ${PLEX_ORIGIN}
      PLEX_TOKEN: ${PLEX_TOKEN}
      TMDB_KEY: ${TMDB_KEY}
      AUDD_API_TOKEN: ${AUDD_API_TOKEN:-}
      XRAY_STORE: /timelines
      XRAY_ENGINE_AUDIO_URL: http://engine-audio:8082
      # Speaker diarization for animated titles, where faces cannot work.
      # Only reachable when the container is up:
      #   docker compose --profile speakers up -d --build
      XRAY_ENGINE_SPEAKERS_URL: http://engine-speakers:8083
      # uncomment to run face work in the engine-faces container instead of
      # in-process (the GPU/scale-out swap point):
      # XRAY_ENGINE_FACES_URL: http://engine-faces:8081
      # optional nightly batch:
      # SCHEDULE_LIBRARY: "TV Shows"
      # SCHEDULE_MAX_TITLES: "3"
      # SCHEDULE_HOUR_UTC: "3"
    volumes:
      - timelines:/timelines
    depends_on: [engine-audio]

  engine-faces:
    container_name: openxray-engine-faces
    build: { context: .., dockerfile: generator/engine-faces.Dockerfile }
    # opt-in from the orchestrator via XRAY_ENGINE_FACES_URL (local in-process
    # faces is the default; this container is the GPU/scale-out swap point)
    volumes:
      - timelines:/timelines

  engine-audio:
    container_name: openxray-engine-audio
    build: { context: .., dockerfile: generator/engine-audio.Dockerfile }
    volumes:
      - timelines:/timelines

  engine-speakers:
    container_name: openxray-engine-speakers
    build:
      context: ..
      dockerfile: generator/engine-speakers.Dockerfile
      # OPTIONAL. With HF_TOKEN set in the environment the gated pyannote
      # weights are baked into the image as a BuildKit secret (never a layer,
      # never image history), giving a container that reaches nothing at
      # runtime. Without it the build still succeeds and the weights are
      # fetched later from Setup → Speakers in the dashboard, which is the
      # path that can say WHICH of the three gates is unaccepted.
      secrets: [hf_token]
      args:
        # CPU torch by default; a CUDA host sets SPEAKERS_TORCH_INDEX in .env
        # (e.g. https://download.pytorch.org/whl/cu124) and layers gpu.yml on
        # top for the runtime device reservation. See gpu.yml.
        TORCH_INDEX: ${SPEAKERS_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    # OPT-IN. torch is ~200 MB even CPU-only and most libraries are live
    # action, where this never runs, so a default `up` must not pull it:
    #   docker compose --profile speakers up -d
    profiles: ["speakers"]
    environment:
      # torch defaults to a single thread in a container: measured 1.2x
      # realtime against 3.6x threaded, a 3x difference for one setting.
      XRAY_VOICE_THREADS: ${XRAY_VOICE_THREADS:-8}
      # Reads the HuggingFace token out of settings.json on the shared volume,
      # the same file every other credential lives in. Nothing is pushed to
      # this container: an engine that reads the file needs no re-push after a
      # restart, and the token never crosses the wire between containers.
      XRAY_STORE: /timelines
      # Only a fallback, for a stack whose settings.json predates this key
      # (env vars seed settings on FIRST boot only). The dashboard is the
      # normal way in.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - timelines:/timelines

secrets:
  # Build-time only, and optional. To bake the weights in, accept the gates on
  # speaker-diarization-3.1, segmentation-3.0 and speaker-diarization-
  # community-1, then:
  #   HF_TOKEN=hf_... docker compose --profile speakers build
  hf_token:
    environment: HF_TOKEN

volumes:
  timelines:
    name: openxray-timelines
